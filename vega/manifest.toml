schema-version = 1

# No `icon` key: an `@image/...` reference needs a registered resource, and without
# one the device rejects the package at install with `error (Package is invalid)`.
# `version` here is a placeholder; the packaged value comes from --build-version.
[package]
id = "space.nuvio.vega"
title = "Nuvio TV"
version = "0.3.8"

[components]
[[components.interactive]]
id = "space.nuvio.vega.main"
runtime-module = "/com.amazon.kepler.keplerscript.runtime.loader_2@IKeplerScript_2_0"
categories = ["com.amazon.category.main"]
launch-type = "singleton"

[processes]
[[processes.group]]
component-ids = ["space.nuvio.vega.main"]

[wants]
[[wants.service]]
id = "com.amazon.media.server"

[[wants.service]]
id = "com.amazon.mediametrics.service"

[[wants.service]]
id = "com.amazon.mediabuffer.service"

[[wants.service]]
id = "com.amazon.mediatransform.service"

[[wants.service]]
id = "com.amazon.audio.stream"

[[wants.service]]
id = "com.amazon.audio.control"

[[wants.service]]
id = "com.amazon.drm.key"

[[wants.service]]
id = "com.amazon.drm.crypto"

[[wants.service]]
id = "com.amazon.inputmethod.service"

[[wants.service]]
id = "com.amazon.kepler.ucc.publisher"

[[wants.privilege]]
id = "com.amazon.privilege.security.file-sharing"
